[project]
name = "backend"
version = "0.1.0"
description = "TrainNet ETA Simulator — backend API"
readme = "README.md"
authors = [
    { name = "Prince Patel", email = "princempatel2007@gmail.com" }
]
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.111",
    "pydantic>=2.7",
    "uvicorn[standard]>=0.30",
    "websockets>=12",
]

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
